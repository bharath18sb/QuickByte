{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to order your favourite food.</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-alt">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    <div class="demo-note">
      <strong>Demo login</strong><br>
      Customer: demo@quickbyte.com / demo123<br>
      Admin: admin@quickbyte.com / admin123
    </div>
  </div>
</section>
{% endblock %}
