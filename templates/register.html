{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="container auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="muted">Join Quickbyte and start ordering in minutes.</p>
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Full name
        <input type="text" name="name" value="{{ name or '' }}" required autofocus>
      </label>
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="6" required>
        <span class="field-hint">At least 6 characters</span>
      </label>
      <label>Confirm password
        <input type="password" name="confirm" minlength="6" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
